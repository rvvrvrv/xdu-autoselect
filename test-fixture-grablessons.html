<script>
document.querySelectorAll('tr[data-exp]').forEach(function (row) {
  var icon = row.querySelector('.el-table__expand-icon');
  if (!icon) return;
  icon.addEventListener('click', function () {
    var old = row.nextElementSibling;
    if (old && old.classList.contains('exp-holder')) {
      old.remove(); icon.classList.remove('el-table__expand-icon--expanded'); return;
    }
    var tr = document.getElementById(row.getAttribute('data-exp')).content.firstElementChild.cloneNode(true);
    tr.classList.add('exp-holder');
    row.after(tr);
    icon.classList.add('el-table__expand-icon--expanded');
  });
});
</script>
